name: CD Frontend Deployment with Docker Hub

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DEPLOY_PATH_ON_SERVER: /home/${{ secrets.SSH_USER }}/testpilot/frontend
  MAIN_COMPOSE_FILE: docker-compose.frontend.yml

jobs:
  build-push-deploy:
    name: Build, Push to Docker Hub, and Deploy Frontend
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image_name
        run: echo "IMAGE_NAME=$(echo '${{ github.event.repository.name }}-frontend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          script:
            echo "Connecting to server: ${{ env.DOCKERHUB_USERNAME }}"
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: . # Next.js root
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: ""
          cache-to: ""
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Connecting to server: ${{ secrets.SSH_HOST }}"
            cd ${{ env.DEPLOY_PATH_ON_SERVER }}
            echo "Deploying frontend container..."

            echo "Logging into Docker Hub from server"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling latest frontend image"
            docker compose -f "${{ env.MAIN_COMPOSE_FILE }}" pull frontend

            echo "Restarting frontend service"
            docker compose -f "${{ env.MAIN_COMPOSE_FILE }}" up -d --force-recreate --remove-orphans frontend

            echo "Frontend deployment complete."
