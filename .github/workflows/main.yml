name: CD Frontend Deployment with Docker Hub
on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DEPLOY_PATH_ON_SERVER: /home/${{ secrets.SSH_USER }}/testpilot/frontend
  MAIN_COMPOSE_FILE: docker-compose.frontend.yml
  ENV_COMPOSE_FILE: .env.frontend

jobs:
  build-push-deploy:
    name: Build, Push to Docker Hub, and Deploy Frontend
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image_name
        run: echo "IMAGE_NAME=$(echo '${{ github.event.repository.name }}-frontend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          script:
          echo "Connecting to server: ${{ env.DOCKERHUB_USERNAME }}"
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Debug Secrets
        run: |
          echo "NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}"
          echo "AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' }}"

      - name: Build and Push Frontend Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: . # Next.js root
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_AUTH_BASE_URL=${{ secrets.NEXT_PUBLIC_AUTH_BASE_URL }}
            NEXT_PUBLIC_AUTH_GITHUB_ID=${{ secrets.NEXT_PUBLIC_AUTH_GITHUB_ID }}
            NEXT_PUBLIC_AUTH_GITHUB_API=${{ secrets.NEXT_PUBLIC_AUTH_GITHUB_API }}
            NEXT_PUBLIC_AUTH_GITHUB_SECRET=${{ secrets.NEXT_PUBLIC_AUTH_GITHUB_SECRET }}
            AUTH_GOOGLE_ID=${{ secrets.AUTH_GOOGLE_ID }}
            AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_URL=${{ secrets.AUTH_URL }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Connecting to server: ${{ secrets.SSH_HOST }}"
            cd ${{ env.DEPLOY_PATH_ON_SERVER }}
            echo "Deploying frontend container..."

            echo "Checking for .env or .env.frontend..."
            if [ ! -f .env ] && [ ! -f .env.frontend ]; then
              echo "❌ ERROR: .env or .env.frontend file not found!"
              exit 1
            fi

            echo "Validating docker-compose configuration..."
            docker compose -f "${{ env.MAIN_COMPOSE_FILE }}" config

            echo "Logging into Docker Hub from server"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Pulling latest frontend image"
            docker compose --env-file ${{env.ENV_COMPOSE_FILE}} -f "${{ env.MAIN_COMPOSE_FILE }}" pull frontend

            echo "Restarting frontend service"
            docker compose --env-file ${{env.ENV_COMPOSE_FILE}} -f "${{ env.MAIN_COMPOSE_FILE }}" up -d --force-recreate --remove-orphans frontend

            echo "Frontend deployment complete."
